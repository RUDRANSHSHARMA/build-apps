<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white p-6 shadow-xl" data-sidebar>
      <h2 class="text-lg font-bold text-secondary">Client Panel</h2>
      <nav class="mt-8 space-y-3 text-sm">
        <a href="/client/dashboard.html" class="block rounded-lg px-3 py-2 text-slate-600">Dashboard</a>
        <a href="/client/orders.html" class="block rounded-lg px-3 py-2 text-slate-600">My Orders</a>
        <a href="/client/new-order.html" class="block rounded-lg px-3 py-2 text-slate-600">New Order</a>
        <a href="/client/profile.html" class="block rounded-lg bg-primary/10 px-3 py-2 text-primary">Profile</a>
        <a href="/client/payments.html" class="block rounded-lg px-3 py-2 text-slate-600">Payments</a>
        <a href="/client/messages.html" class="block rounded-lg px-3 py-2 text-slate-600">Messages</a>
      </nav>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold text-secondary">My Profile</h1>
      <form class="mt-6 grid gap-6 rounded-2xl bg-white p-6 shadow">
        <div class="grid gap-4 md:grid-cols-2">
          <input type="text" placeholder="Full name" class="rounded-lg border px-4 py-3" />
          <input type="email" placeholder="Email" class="rounded-lg border px-4 py-3" />
          <input type="tel" placeholder="Phone" class="rounded-lg border px-4 py-3" />
          <input type="text" placeholder="Address" class="rounded-lg border px-4 py-3" />
        </div>
        <div>
          <label class="text-sm font-semibold">Change Password</label>
          <div class="mt-2 grid gap-3 md:grid-cols-2">
            <input type="password" placeholder="New password" class="rounded-lg border px-4 py-3" />
            <input type="password" placeholder="Confirm password" class="rounded-lg border px-4 py-3" />
          </div>
        </div>
        <button class="btn-primary w-fit rounded-full px-6 py-3 text-sm font-semibold text-white" type="submit">Save Changes</button>
      </form>
    </main>
  </div>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
