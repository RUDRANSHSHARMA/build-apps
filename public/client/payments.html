<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white p-6 shadow-xl" data-sidebar>
      <h2 class="text-lg font-bold text-secondary">Client Panel</h2>
      <nav class="mt-8 space-y-3 text-sm">
        <a href="/client/dashboard.html" class="block rounded-lg px-3 py-2 text-slate-600">Dashboard</a>
        <a href="/client/orders.html" class="block rounded-lg px-3 py-2 text-slate-600">My Orders</a>
        <a href="/client/new-order.html" class="block rounded-lg px-3 py-2 text-slate-600">New Order</a>
        <a href="/client/profile.html" class="block rounded-lg px-3 py-2 text-slate-600">Profile</a>
        <a href="/client/payments.html" class="block rounded-lg bg-primary/10 px-3 py-2 text-primary">Payments</a>
        <a href="/client/messages.html" class="block rounded-lg px-3 py-2 text-slate-600">Messages</a>
      </nav>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold text-secondary">Payment History</h1>
      <div class="mt-6 rounded-2xl bg-white p-6 shadow">
        <table class="w-full text-sm">
          <thead class="text-left text-slate-500">
            <tr>
              <th class="py-2">Invoice</th>
              <th>Date</th>
              <th>Service</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-t">
              <td class="py-3">INV-2026-001</td>
              <td>Feb 12, 2026</td>
              <td>Logo Design</td>
              <td>₹500</td>
              <td><span class="rounded-full bg-green-100 px-3 py-1 text-xs text-green-700">Paid</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
