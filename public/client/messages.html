<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white p-6 shadow-xl" data-sidebar>
      <h2 class="text-lg font-bold text-secondary">Client Panel</h2>
      <nav class="mt-8 space-y-3 text-sm">
        <a href="/client/dashboard.html" class="block rounded-lg px-3 py-2 text-slate-600">Dashboard</a>
        <a href="/client/orders.html" class="block rounded-lg px-3 py-2 text-slate-600">My Orders</a>
        <a href="/client/new-order.html" class="block rounded-lg px-3 py-2 text-slate-600">New Order</a>
        <a href="/client/profile.html" class="block rounded-lg px-3 py-2 text-slate-600">Profile</a>
        <a href="/client/payments.html" class="block rounded-lg px-3 py-2 text-slate-600">Payments</a>
        <a href="/client/messages.html" class="block rounded-lg bg-primary/10 px-3 py-2 text-primary">Messages</a>
      </nav>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold text-secondary">Messages</h1>
      <div class="mt-6 grid gap-6 lg:grid-cols-3">
        <div class="rounded-2xl bg-white p-4 shadow">
          <input type="text" placeholder="Search" class="w-full rounded-lg border px-3 py-2 text-sm" />
          <div class="mt-4 space-y-3">
            <div class="rounded-xl bg-primary/10 p-3 text-sm">
              <p class="font-semibold">Support Team</p>
              <p class="text-xs text-slate-500">We have started your order.</p>
            </div>
          </div>
        </div>
        <div class="lg:col-span-2 rounded-2xl bg-white p-6 shadow">
          <div class="space-y-3">
            <div class="rounded-xl bg-blue-50 p-3 text-sm text-slate-600">Hello! We are starting your logo design today.</div>
            <div class="rounded-xl bg-slate-100 p-3 text-sm text-slate-600 text-right">Thanks, looking forward!</div>
          </div>
          <div class="mt-4 flex gap-2">
            <input type="text" placeholder="Type a message" class="flex-1 rounded-lg border px-4 py-2 text-sm" />
            <button class="rounded-full bg-primary px-4 py-2 text-sm font-semibold text-white">Send</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
