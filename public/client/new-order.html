<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white p-6 shadow-xl" data-sidebar>
      <h2 class="text-lg font-bold text-secondary">Client Panel</h2>
      <nav class="mt-8 space-y-3 text-sm">
        <a href="/client/dashboard.html" class="block rounded-lg px-3 py-2 text-slate-600">Dashboard</a>
        <a href="/client/orders.html" class="block rounded-lg px-3 py-2 text-slate-600">My Orders</a>
        <a href="/client/new-order.html" class="block rounded-lg bg-primary/10 px-3 py-2 text-primary">New Order</a>
        <a href="/client/profile.html" class="block rounded-lg px-3 py-2 text-slate-600">Profile</a>
        <a href="/client/payments.html" class="block rounded-lg px-3 py-2 text-slate-600">Payments</a>
        <a href="/client/messages.html" class="block rounded-lg px-3 py-2 text-slate-600">Messages</a>
      </nav>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold text-secondary">Place a New Order</h1>
      <form class="mt-6 grid gap-6 rounded-2xl bg-white p-6 shadow">
        <div>
          <label class="text-sm font-semibold">Service</label>
          <select class="mt-2 w-full rounded-lg border px-4 py-3">
            <option>Logo Design</option>
            <option>Social Media Posts</option>
            <option>Business Card</option>
            <option>Blog Writing</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-semibold">Quantity</label>
          <input type="number" value="1" class="mt-2 w-full rounded-lg border px-4 py-3" />
        </div>
        <div>
          <label class="text-sm font-semibold">Requirements</label>
          <textarea rows="4" class="mt-2 w-full rounded-lg border px-4 py-3"></textarea>
        </div>
        <div>
          <label class="text-sm font-semibold">Reference Files</label>
          <input type="file" class="mt-2 w-full rounded-lg border px-4 py-3" />
        </div>
        <button class="btn-primary w-full rounded-full px-6 py-3 text-sm font-semibold text-white" type="submit">Proceed to Payment</button>
      </form>
    </main>
  </div>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
