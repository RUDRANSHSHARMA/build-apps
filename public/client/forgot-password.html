<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen items-center justify-center p-8">
    <form class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">
      <h2 class="text-2xl font-bold text-secondary">Reset Password</h2>
      <p class="mt-2 text-sm text-slate-500">Enter your email to receive a reset link.</p>
      <input type="email" required placeholder="Email" class="mt-6 w-full rounded-lg border px-4 py-3" />
      <button class="btn-primary mt-6 w-full rounded-full px-6 py-3 text-sm font-semibold text-white" type="submit">Send Reset Link</button>
    </form>
  </div>
</body>
</html>
