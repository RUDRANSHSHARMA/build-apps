<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen items-center justify-center p-8">
    <form class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl" id="admin-login-form">
      <h2 class="text-2xl font-bold text-secondary">Admin Login</h2>
      <div class="mt-6 space-y-4">
        <input type="email" name="email" required placeholder="Email" class="w-full rounded-lg border px-4 py-3" />
        <input type="password" name="password" required placeholder="Password" class="w-full rounded-lg border px-4 py-3" />
        <input type="text" name="otp" required placeholder="6-digit OTP" class="w-full rounded-lg border px-4 py-3" />
        <button class="btn-primary w-full rounded-full px-6 py-3 text-sm font-semibold text-white" type="submit">Login</button>
      </div>
    </form>
  </div>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
